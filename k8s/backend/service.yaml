apiVersion: v1
kind: Service
# Named "backend" on purpose: frontend/nginx.conf proxies /api/ to
# http://backend:4646/, and that same config file is baked into the image used by
# docker-compose (where the service is also called "backend"). Naming the Service
# "ev-backend" meant nginx could not resolve the upstream inside the cluster.
metadata:
  name: backend
  labels:
    app: ev-backend
spec:
  selector:
    app: ev-backend
  ports:
    - protocol: TCP
      port: 4646
      targetPort: 4646
  type: ClusterIP
