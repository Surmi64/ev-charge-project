# The client's real address. Requests arrive through Tailscale serve and Docker's
# port proxy, so $remote_addr is a private hop, not the person. Only those hops are
# trusted to say who is behind them; anything they forward is taken from
# X-Forwarded-For. The backend reads the result from X-Real-IP for rate limits, the
# security log and the session list — without this every request looked like it came
# from one address, and a per-address limit would have throttled everyone at once.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 100.64.0.0/10;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name localhost;

    # Hashed build output: the filename changes whenever the contents do, so it can
    # be cached indefinitely.
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        # index.html names those hashed files, so a cached copy pins the browser to an
        # old build. It must be revalidated every time.
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/ {
        proxy_pass http://backend:4646/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
