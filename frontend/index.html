<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/gauge.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050508" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mileage" />
    <link rel="apple-touch-icon" href="/gauge.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Loaded here rather than through an @import in index.css. The @import cost
         three serial round trips (css -> font css -> font files), so the swap landed
         long after first paint and visibly reflowed every heading.
         display=optional means the browser uses the fallback if the font is not ready
         in time and then does NOT swap, so there is no reflow either way. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=optional"
    />
    <title>Mileage</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
