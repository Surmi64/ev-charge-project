# Included in every location that sets its own headers: nginx drops inherited
# add_header directives as soon as a location adds one of its own.
#
# The policy names exactly what the app loads: its own bundle, Google Fonts, map tiles
# from OpenStreetMap, and blob:/data: images for the PDF export and the map. Inline
# styles stay allowed because MUI and Emotion inject them at runtime. Adding a new
# third-party origin (a tile provider, a payment overlay) means adding it here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Location capture is the one browser capability the app uses.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
# Tailscale serve (and any production proxy) terminates HTTPS in front of this.
add_header Strict-Transport-Security "max-age=31536000" always;
